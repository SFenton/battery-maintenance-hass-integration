[project]
name = "battery-maintenance-hass-integration"
version = "0.3.2"
description = "Home Assistant battery maintenance task coordinator"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
